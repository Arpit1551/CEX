[package]
name = "CEX"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.15.0"
chrono = "0.4.45"
futures = "0.3.34"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
rand = "0.10.2"
serde = { version = "1", features = ["derive"] }

[[bin]]
name = "CEX"
path = "src/main.rs"
